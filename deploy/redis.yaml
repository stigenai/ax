apiVersion: v1
kind: Namespace
metadata:
  name: ax-system
---
# Task records, workspaces and the task stream live here. The claim uses the
# cluster default StorageClass. See docs/redis-persistence.md.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ax-redis-data
  namespace: ax-system
  labels:
    app.kubernetes.io/name: ax-redis
    app.kubernetes.io/part-of: ax
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ax-redis
  namespace: ax-system
  labels:
    app.kubernetes.io/name: ax-redis
    app.kubernetes.io/part-of: ax
spec:
  replicas: 1
  # The claim is ReadWriteOnce: two pods must not share one AOF dir.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ax-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ax-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          # args, not command: the image entrypoint then runs chown on /data.
          args:
            - --appendonly
            - "yes"
            - --appendfsync
            - everysec
            - --dir
            - /data
          ports:
            - containerPort: 6379
              name: redis
          # PING gives LOADING while Redis reads the AOF. Only PONG is ready.
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - '[ "$(redis-cli ping)" = PONG ]'
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ax-redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: ax-redis
  namespace: ax-system
  labels:
    app.kubernetes.io/name: ax-redis
    app.kubernetes.io/part-of: ax
spec:
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  selector:
    app.kubernetes.io/name: ax-redis
