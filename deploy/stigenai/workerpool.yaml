# Warm workers for ordinary AX tasks, whose templates carry no workerSelector.
# Protected Fabriek supervisors require a separate labeled pool; see
# docs/fabriek-supervisor.md.
# The worker image must match the installed Substrate version, as must the
# nodeSelector (ate-setup stamps ate.dev/substrate-version on worker nodes).
apiVersion: ate.dev/v1alpha1
kind: WorkerPool
metadata:
  name: ax
  namespace: ax-system
  labels:
    workload: ax
spec:
  replicas: 6
  workerImage: ghcr.io/stigenai/substrate/ateom-gvisor:v0.3.0-stigenai.2@sha256:9c4721241aaf7da1dd8832467c0e6bf472a1c8a18233ac206d3b7535f44c6dc1
  template:
    nodeSelector:
      ate.dev/substrate-version: v0.3.0-stigenai.2
    # Each pod runs one ateom container. The worker shares its memory limit
    # between all tasks placed on it. One OOM kills every task on that
    # worker.
    #
    # A single kubectl top sample on 2026-10-15 measured one task's memory
    # at about 2200Mi. This is a point-in-time delta. It is not a peak or a
    # load test. An idle worker used about 400Mi.
    #
    # Six workers at 16Gi (16384Mi) hold 7 tasks per worker. The calculation
    # is 7*2200+400=15800Mi. The simulation places 20 tasks at random across
    # the workers. It runs 200,000 trials. Each worker's capacity is set by
    # floor((limit-400Mi)/2200Mi).
    #
    # The simulation gives this probability, P(at least one of the N workers
    # exceeds its limit), for each option:
    #   - 4 workers at 20Gi: 5.55%
    #   - 8 workers at 14Gi: 6.67%
    #   - 6 workers at 16Gi: 6.74%
    #   - 5 workers at 16Gi: 16.0%
    #   - 8 workers at 12Gi: 24.2%
    #   - 6 workers at 12Gi: 55.4%
    #
    # 6 workers at 16Gi is not the lowest-risk option. It accepts a little
    # more risk. The risk is 6.74% here, vs 5.55% for 4x20Gi and 6.67% for
    # 8x14Gi.
    #
    # In return, it gives three benefits:
    #   - A smaller blast radius per OOM: 1/6 of total capacity is lost,
    #     vs 1/4 for 4x20Gi.
    #   - A smaller per-pod memory request: 8Gi. The scheduler fits it more
    #     easily than the bigger 4x20Gi pods.
    #   - A smaller total limit across all workers: 96Gi, vs 112Gi for 8x14Gi.
    #
    # See ax-ci8 for the full placement model, the node headroom check and
    # the rejected options.
    #
    # The 8Gi (8192Mi) request equals the average load per worker at 20
    # tasks. The calculation is 20/6*2200+400=7733Mi. This lets the scheduler
    # place workers by their real need.
    #
    # ax-768: the sizing above bounds the risk of random placement. That
    # was the worst case this pool ever saw.
    #
    # Placement is no longer random. For each task, Substrate books a specified
    # quantity against the reported memory limit of its worker.
    # The env var AX_DEFAULT_TASK_MEMORY, in deploy/stigenai/kustomization.yaml,
    # sets this quantity.
    #
    # ax-9qu increased this quantity from 4Gi to 7680Mi. A Claude Code session
    # plus a Go or Node build must have more than 4Gi.
    #
    # At this time, a 16Gi (16384Mi) worker accepts at most 2 tasks.
    # 2*7680Mi=15360Mi is less than 16384Mi. 3*7680Mi=23040Mi is more than
    # 16384Mi.
    #
    # 6 workers accept 12 tasks in total. A 13th task on a full pool waits.
    # Its phase is Pending, with reason WaitingForCapacity. It is not put
    # on a full worker.
    #
    # This same booked quantity is also the hard cgroup memory cap of the task
    # (ax-768). ax-j8u tells Substrate to divide booking from cap.
    #
    # 2*7680Mi plus about 400Mi for ateom itself is 15760Mi. That is less than
    # the 16384Mi pod limit. So 2 tasks at their own cap do not also cause an
    # OOM in the pod around them.
    #
    # ax-9gp: AX_MAX_TASK_MEMORY is set in
    # deploy/stigenai/kustomization.yaml, on both ax-server and
    # ax-controller. It must equal this limits.memory value.
    # A task that asks for more gets a clear Failed status.
    # It does not wait forever for a worker that can never fit it.
    resources:
      limits:
        cpu: "4"
        memory: 16Gi
      requests:
        cpu: 500m
        memory: 8Gi
