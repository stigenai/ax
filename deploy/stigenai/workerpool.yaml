# Warm workers for ordinary AX tasks, whose templates carry no workerSelector.
# Protected Fabriek supervisors require a separate labeled pool; see
# docs/fabriek-supervisor.md.
# The worker image must match the installed Substrate version, as must the
# nodeSelector (ate-setup stamps ate.dev/substrate-version on worker nodes).
apiVersion: ate.dev/v1alpha1
kind: WorkerPool
metadata:
  name: ax
  namespace: ax-system
  labels:
    workload: ax
spec:
  # 10 workers hold 20 tasks at 2 tasks per worker (see below). On 2026-10-20,
  # 6 workers held the factory manager and 11 worker tasks, and 11 more tasks
  # waited for hours with WaitingForCapacity. Four more 8Gi requests fit the
  # memory headroom of gtr-150 (2), gtr-151 (1) and gtr-152 (1). The comments
  # below still describe the 6-worker sizing.
  replicas: 10
  workerImage: ghcr.io/stigenai/substrate/ateom-gvisor:v0.3.0-stigenai.2@sha256:9c4721241aaf7da1dd8832467c0e6bf472a1c8a18233ac206d3b7535f44c6dc1
  template:
    nodeSelector:
      ate.dev/substrate-version: v0.3.0-stigenai.2
    # Each pod runs one ateom container. The worker shares its memory limit
    # between all tasks placed on it. One OOM kills every task on that
    # worker.
    #
    # A single kubectl top sample on 2026-10-15 measured one task's memory
    # at about 2200Mi. This is a point-in-time delta. It is not a peak or a
    # load test. An idle worker used about 400Mi.
    #
    # Six workers at 16Gi (16384Mi) hold 7 tasks per worker. The calculation
    # is 7*2200+400=15800Mi. The simulation places 20 tasks at random across
    # the workers. It runs 200,000 trials. Each worker's capacity is set by
    # floor((limit-400Mi)/2200Mi).
    #
    # The simulation gives this probability, P(at least one of the N workers
    # exceeds its limit), for each option:
    #   - 4 workers at 20Gi: 5.55%
    #   - 8 workers at 14Gi: 6.67%
    #   - 6 workers at 16Gi: 6.74%
    #   - 5 workers at 16Gi: 16.0%
    #   - 8 workers at 12Gi: 24.2%
    #   - 6 workers at 12Gi: 55.4%
    #
    # 6 workers at 16Gi is not the lowest-risk option. It accepts a little
    # more risk. The risk is 6.74% here, vs 5.55% for 4x20Gi and 6.67% for
    # 8x14Gi.
    #
    # In return, it gives three benefits:
    #   - A smaller blast radius per OOM: 1/6 of total capacity is lost,
    #     vs 1/4 for 4x20Gi.
    #   - A smaller per-pod memory request: 8Gi. The scheduler fits it more
    #     easily than the bigger 4x20Gi pods.
    #   - A smaller total limit across all workers: 96Gi, vs 112Gi for 8x14Gi.
    #
    # See ax-ci8 for the full placement model, the node headroom check and
    # the rejected options.
    #
    # The 8Gi (8192Mi) request equals the average load per worker at 20
    # tasks. The calculation is 20/6*2200+400=7733Mi. This lets the scheduler
    # place workers by their real need.
    #
    # ax-768: the sizing above bounds the risk of random placement. That
    # was the worst case this pool ever saw.
    #
    # Placement is no longer random. For each task, Substrate books a specified
    # quantity against the reported memory limit of its worker.
    # The env var AX_DEFAULT_TASK_MEMORY, in deploy/stigenai/kustomization.yaml,
    # sets this quantity.
    #
    # ax-9qu increased this quantity from 4Gi to 8Gi. A Claude Code session
    # needs more than 4Gi. A Go or Node build also needs more than 4Gi.
    #
    # At this time, a 16Gi (16384Mi) worker accepts at most 2 tasks.
    # 2*8192Mi=16384Mi equals the worker limit exactly. 3*8192Mi=24576Mi is
    # more than 16384Mi.
    #
    # 6 workers accept 12 tasks in total. A 13th task on a full pool waits.
    # Its phase is Pending, with reason WaitingForCapacity. It is not put
    # on a full worker.
    #
    # This same booked quantity is also the hard cgroup memory cap of the task
    # (ax-768). ax-j8u tells Substrate to divide booking from cap.
    #
    # 2*8192Mi leaves no margin inside the 16384Mi pod limit for ateom's own
    # overhead (about 400Mi). The earlier 7680Mi default left that margin;
    # 8Gi does not. So 2 tasks, each already at its own 8Gi cap, can still
    # push the pod itself to its limit. The person accepted this risk when
    # setting the live value. This change does not fix it.
    #
    # ax-9gp: AX_MAX_TASK_MEMORY is set in
    # deploy/stigenai/kustomization.yaml, on both ax-server and
    # ax-controller. It must equal this limits.memory value.
    # A task that asks for more gets a clear Failed status.
    # It does not wait forever for a worker that can never fit it.
    #
    # ax-6cj: AX_MAX_TASK_CPU is the cpu twin of AX_MAX_TASK_MEMORY above.
    # It is set the same way. It must equal this limits.cpu value (6).
    #
    # ax-1iw: The cpu request of 500m and the limit of 4 throttled the workers.
    # The workers ran 2 tasks at once.
    #
    # The script deploy/stigenai/measure-workerpool-cpu.sh reads each pod's CFS
    # throttle ratio from cadvisor.
    # The throttle ratio is the share of CPU scheduling periods that the kernel
    # throttled.
    # It counts since each pod's last start.
    #
    # On 2026-10-16, the busiest worker ran 2 booked tasks.
    # 5 of 6 pods were at or above 5%: 3.1-21.4%.
    # kubectl top also read one pod at 3324-3998m of its 4000m limit.
    # The 6 samples were 15s apart.
    # This shows sustained near-limit use, not a one-off spike.
    #
    # The density cap does not change here. The cap is 2 tasks/worker, from
    # AX_DEFAULT_TASK_MEMORY on a 16Gi worker.
    # Only the cpu request and limit change.
    #
    # The limit of 6 gives 3 cores per task at 2 tasks.
    # The ax-ci8 measurement is about 2042m per task.
    # The limit also leaves room for a burst.
    #
    # The request of 2 gives 1 core per booked task.
    # This is closer to the observed sustained use (357-3998m) than the old
    # 500m request.
    # The old request was 6-8x under that use.
    #
    # Pool sums: requests go from 3 cores (6 x 500m) to 12 cores (6 x 2).
    # Limits go from 24 cores (6 x 4) to 36 cores (6 x 6).
    #
    # This change adds to the cluster-wide cpu overcommit. See ax-052.
    # This change does not close it.
    #
    # Each node has 2 workers. Requests rise by 3 cores per node.
    # Limits rise by 4 cores per node.
    #
    # gtr-150 is the busiest node. Its requests go from 15600m to 18600m.
    # The requested 18600m is 58% of its 32 cores.
    #
    # See ax-1iw for the throttle data, the rejected options and the rollout note.
    # The rejected options are:
    #   - no cpu limit
    #   - request-only
    #   - more replicas
    #   - spread placement, filed as ax-ok6
    #
    # The rollout note: any resources change restarts every worker.
    resources:
      limits:
        cpu: "6"
        memory: 16Gi
      requests:
        cpu: "2"
        memory: 8Gi
