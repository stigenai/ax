# stigenai fleet (k0s, Substrate installed from stigenai/substrate's k0s
# profile). redis.yaml goes on as-is (it repeats the ax-system Namespace, so
# it cannot share a kustomization with the others):
#   kubectl apply -f deploy/redis.yaml
#   kubectl kustomize --load-restrictor LoadRestrictionsNone deploy/stigenai | KO_DOCKER_REPO=ghcr.io/stigenai/ax \
#     ko resolve --bare=false -f - | kubectl apply -f -
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../ax-server.yaml
  - ../ax-controller.yaml
  - workerpool.yaml

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ax-controller
        namespace: ax-system
      spec:
        template:
          spec:
            containers:
              - name: controller
                env:
                  # Substrate's k0s profile keeps snapshots in its in-cluster
                  # rustfs bucket; the storage layer reads only bucket + path,
                  # so the gs:// scheme is just the form AX validates.
                  - name: AX_SNAPSHOTS_BUCKET
                    value: gs://ate-snapshots/ax/
                  # Substrate rejects actor images not pinned by digest.
                  - name: AX_DEFAULT_TASK_IMAGE
                    value: ghcr.io/stigenai/ax/ax-task-runner:v0.3.1-stigenai.1@sha256:fdc4c5d665e3668d8d08e0ccfab620864654f2c1a9c21570f46ca97462cdac98
                  # Books 8Gi against each worker's reported memory for any
                  # task that names no memory limit of its own, so Substrate's
                  # scheduler stops placing more tasks than a worker can hold.
                  # See deploy/stigenai/workerpool.yaml for the sizing math.
                  - name: AX_DEFAULT_TASK_MEMORY
                    value: 8Gi
                  # ax-9gp: a task's own (or default) memory limit can
                  # exceed this value. Such a task can never fit any worker.
                  # Reconcile fails it with reason MemoryExceedsCapacity.
                  # It does not loop through WaitingForCapacity/Pending.
                  # This value must equal limits.memory in
                  # deploy/stigenai/workerpool.yaml (16Gi).
                  # See the reverse note there.
                  - name: AX_MAX_TASK_MEMORY
                    value: 16Gi
                  #
                  # ax-6cj: the cpu twin of AX_MAX_TASK_MEMORY above.
                  # Reconcile fails a task above this value with reason
                  # CPUExceedsCapacity, instead of a WaitingForCapacity loop.
                  # This value must equal limits.cpu in
                  # deploy/stigenai/workerpool.yaml (6); see the reverse
                  # note there.
                  - name: AX_MAX_TASK_CPU
                    value: "6"
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ax-server
        namespace: ax-system
      spec:
        template:
          spec:
            containers:
              - name: ax-server
                env:
                  # ax-9gp: UpdateTask rejects a task above this value at
                  # create/update time, before it ever reaches ax-controller.
                  # This must equal limits.memory in
                  # deploy/stigenai/workerpool.yaml (16Gi); see the reverse
                  # note there.
                  - name: AX_MAX_TASK_MEMORY
                    value: 16Gi
                  #
                  # ax-6cj: the cpu twin of AX_MAX_TASK_MEMORY above.
                  # UpdateTask rejects a task above this value at
                  # create/update time, before it ever reaches ax-controller.
                  # This must equal limits.cpu in
                  # deploy/stigenai/workerpool.yaml (6); see the reverse
                  # note there.
                  - name: AX_MAX_TASK_CPU
                    value: "6"
