# FORK.md on stigenai/deploy lists this workflow as fork carry.
#
# stigenai/deploy is a patch stack on a google/ax tag.
# Each week, the job finds the newest google/ax tag. It includes -rc tags.
# If the stack is on an older tag, the job rebases the stack on the runner.
# The job does not push.
#
# Then the job runs the tests and hack/fork/fork.sh check.
#
# The job fails if the rebase stops on a conflict.
# The summary then shows the commit and its files.
# The job also fails if a test or the check fails.
# If the stack is on an older tag, the job fails at the end.
# A human then does the rebase, as FORK.md tells.
#
# Keep this file on main.
# GitHub reads schedule triggers only from the default branch.

name: upstream-sync

on:
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trial-rebase:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ax
          POSTGRES_PASSWORD: ax
          POSTGRES_DB: ax
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ax -d ax"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: stigenai/deploy
          fetch-depth: 0

      - name: Trial rebase onto the newest upstream tag
        id: rebase
        run: |
          git config user.name "upstream-sync"
          git config user.email "upstream-sync@users.noreply.github.com"
          git fetch --quiet --tags https://github.com/google/ax.git
          newest=$(git -c versionsort.suffix=-rc tag -l 'v[0-9]*' --sort=-v:refname | grep -v -- '-stigenai' | head -1)
          base=$(hack/fork/fork.sh base)
          echo "behind=$([ "$base" = "$newest" ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
          {
            echo "## stigenai/deploy on $base, newest upstream tag $newest"
            echo
            echo "- Fork commits: $(git rev-list --count --no-merges "$base..HEAD")"
            echo "- Upstream commits from $base to $newest: $(git rev-list --count "$base..$newest")"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$base" = "$newest" ] && exit 0
          if hack/fork/fork.sh rebase "$newest"; then
            echo "Rebase onto $newest: clean. The tests below run on the rebased stack." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Rebase onto $newest stopped"
            echo
            echo "- Commit: $(git log -1 --format='%h %s' REBASE_HEAD)"
            echo "- Fork-Topic: $(git log -1 --format='%(trailers:key=Fork-Topic,valueonly)' REBASE_HEAD)"
            echo "- Fork commits applied before it: $(git rev-list --count "$newest..HEAD")"
            echo
            echo "Conflicted files:"
            echo
            git diff --name-only --diff-filter=U | while read -r f; do echo "- \`$f\`"; done
          } >> "$GITHUB_STEP_SUMMARY"
          git rebase --abort
          exit 1

      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: go.mod

      - name: Test the stack
        env:
          AX_TEST_POSTGRES_URL: postgres://ax:ax@localhost:5432/ax?sslmode=disable
        run: go test ./...

      - name: Check the fork trailers
        run: hack/fork/fork.sh check

      - name: Fail if the stack is not on the newest tag
        if: steps.rebase.outputs.behind == 'true'
        run: |
          echo "The trial rebase passed. Rebase stigenai/deploy onto the newest tag as FORK.md tells you."
          exit 1
