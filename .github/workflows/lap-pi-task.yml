name: LAP Pi task image
on:
  pull_request:
    branches: [stigenai/deploy]
    paths: ["images/lap-pi-task/**", ".github/workflows/lap-pi-task.yml"]
  push:
    branches: [stigenai/deploy]
    paths: ["images/lap-pi-task/**", ".github/workflows/lap-pi-task.yml"]
  workflow_dispatch: {}
permissions:
  contents: read
  packages: write
jobs:
  task-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and test task image
        run: docker build --platform linux/amd64 -f images/lap-pi-task/Dockerfile -t ghcr.io/stigenai/ax/lap-pi-task:${{ github.sha }} .
      - name: Publish task image
        if: github.event_name != 'pull_request'
        run: docker push ghcr.io/stigenai/ax/lap-pi-task:${{ github.sha }}
