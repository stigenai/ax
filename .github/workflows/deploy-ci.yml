# CI for the stigenai/deploy branch (ax-kky).
#
# go.yml and check-binaries.yml run only on branches: [main]. That is the
# upstream google/ax branch. A pull request against stigenai/deploy gets
# no check-run from them. This workflow adds that check.
#
# The ruleset factory-merge-gate on stigenai/deploy can then require this
# check (ax-kky.2, owner-only: a person must add the check name to the
# ruleset).
#
# The job name build-vet-test is the check name.

name: Deploy CI

on:
  pull_request:
    branches: [ "stigenai/deploy" ]
  push:
    branches: [ "stigenai/deploy" ]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-vet-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ax
          POSTGRES_PASSWORD: ax
          POSTGRES_DB: ax
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ax -d ax"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      AX_TEST_POSTGRES_URL: postgres://ax:ax@localhost:5432/ax?sslmode=disable

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: go.mod

      - name: Verify go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Gofmt
        run: |
          UNFORMATTED="$(gofmt -l .)"
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::gofmt -l found unformatted files:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Build
        run: go build -v ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: |
          set -o pipefail
          go test -count=1 -v ./... | tee /tmp/ax-deploy-ci-test.log

      - name: Verify Postgres-gated store tests ran, none skipped
        run: |
          set -o pipefail
          go test -count=1 -v ./internal/store/postgres/ | tee /tmp/ax-deploy-ci-postgres.log
          if grep -q -- '--- SKIP' /tmp/ax-deploy-ci-postgres.log; then
            echo "::error::internal/store/postgres tests were skipped; the Postgres service was not reachable"
            exit 1
          fi
          grep -q -- '--- PASS' /tmp/ax-deploy-ci-postgres.log || { echo "::error::no --- PASS lines for internal/store/postgres"; exit 1; }
          echo "Postgres-gated store tests ran with no SKIP."
